services:
  postgres:
    image: postgres:16-alpine
    container_name: web-creator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_creator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d web_creator']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
